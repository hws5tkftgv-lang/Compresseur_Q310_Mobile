:inline-block;padding:4px 8px;background:#e4f0f7;color:#176082;border-radius:5px;font-size:.73rem;line-height:1.3;margin-bottom:10px;font-weight:700}.detail{border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:16px}.detail p{font-size:.92rem}.detail .actions,.actions{display:flex;gap:8px;flex-wrap:wrap}.empty{padding:14px;background:#f2f6f9;border-radius:10px;font-size:.91rem;line-height:1.5}.note{background:#fff4d4;border-left:4px solid #dfaa26;padding:11px 12px;font-size:.86rem;line-height:1.45;margin:12px 0}.notice{max-width:1660px;margin:12px auto 0;background:#e5f3fb;border:1px solid #b6d6e8;padding:12px 16px;border-radius:10px;display:flex;gap:12px;align-items:center;justify-content:space-between}.notice p{margin:0;font-size:.9rem}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.grid2 label{margin-top:6px}.teacher-section{border-top:1px solid var(--line);margin-top:15px;padding-top:15px}.teacher-section button.full{width:100%;margin-top:8px}.teacher-section textarea{min-height:76px;resize:vertical}.filelist{padding-left:20px;font-size:.83rem;line-height:1.6}.filelist li{margin:7px 0;word-break:break-word}.link{color:#126f98}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#183c50;color:#fff;border-radius:10px;box-shadow:0 4px 30px #0003;padding:13px 18px;z-index:99;max-width:min(92vw,700px);font-size:.9rem;line-height:1.4}.toast.error{background:#8d2631}.hidden,[hidden]{display:none!important}dialog{width:min(850px,94vw);max-height:90dvh;border:none;border-radius:15px;padding:22px;color:var(--ink);background:#fff;box-shadow:0 10px 70px #0005}dialog::backdrop{background:#071d32b3}.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.dialog-head h2{margin:0}dialog img,dialog video{display:block;max-width:100%;max-height:65dvh;margin:10px auto;object-fit:contain}dialog video{width:100%}.media-item{border-top:1px solid var(--line);padding-top:12px;margin-to /* En consultation, les zones gardent leur surface cliquable sans repère visible. */
.top .button{background:#213e55;color:#fff;border-color:#507089;font-size:.87rem;display:inline-flex;align-items:center}
.zone:not(.editor-zone),.zone:not(.editor-zone):hover,.zone:not(.editor-zone).selected{background:transparent;border-color:transparent;box-shadow:none}
.zone:not(.editor-zone)>span{display:none}
@media(min-width:1800px){.viewport{height:calc(100dvh - 245px)}}
@media(max-width:900px){.layout{grid-template-columns:minmax(0,1fr) 300px}.top{padding:12px}.tools{padding:9px 12px}.work,.side{padding:12px}.viewport{height:calc(100dvh - 255px)}.top p{display:none}}
@media(max-width:650px){.layout{display:block}.top h1{font-size:1.02rem}.top{gap:8px}.monogram{display:none}.tools{gap:6px}.tools select{flex:1;max-width:none;width:100%;font-size:.9rem}.tools .spacer,.tools .counter{display:none}.tools button{font-size:.85rem}.work{padding:12px}.viewport{height:54dvh;min-height:310px}.side{border-left:0;border-top:1px solid var(--line);max-height:none;padding:16px}.caption{font-size:.74rem}.notice{margin:10px 12px 0;flex-direction:column;align-items:stretch}.viewbar button{padding:8px 11px}.top button{padding:8px}.grid2{gap:7px}dialog{padding:16px}.badge{font-size:.68rem}}
@media(max-width:650px){.top{flex-wrap:wrap}.top .actions{width:100%}.top .actions>*{flex:1;justify-content:center;white-space:nowrap}}
@media(prefers-reduced-motion:no-preference){button{transition:background .12s,border-color .12s}}
/* Partage de l'application : affichage, téléchargement et fiche à imprimer. */
.qr-card{max-width:1660px;margin:14px auto 0;padding:14px 18px;display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:12px}
.qr-card-icon{width:46px;height:46px;flex:none;padding:10px;border-radius:10px;background:#e5f3fb;color:#116f9a}
.qr-card-icon svg{display:block;width:100%;height:100%}
.qr-card-copy{flex:1;min-width:0}.qr-card h2{font-size:1rem;margin:0 0 4px}.qr-card p{margin:0;font-size:.87rem;color:#526b7e}
.qr-card button{flex:none}.qr-dialog{width:min(610px,94vw)}.qr-dialog .dialog-head{align-items:flex-start}
.qr-code{width:min(320px,100%);margin:12px auto;background:#fff}.qr-code svg{display:block;width:100%;height:auto}
.qr-url{display:block;text-align:center;overflow-wrap:anywhere;font-size:.84rem;line-height:1.5;color:#116f9a;margin:10px 0 16px}
.qr-dialog .actions{justify-content:center}.qr-dialog .actions button{flex:1}.qr-explanation{margin:14px 0 0;font-size:.85rem;color:#526b7e}
.qr-print-sheet{display:none}
@media(max-width:1700px){.qr-card{margin-left:20px;margin-right:20px}}
@media(max-width:650px){.qr-card{margin:12px 12px 0;flex-wrap:wrap;padding:14px}.qr-card-copy{flex-basis:calc(100% - 60px)}.qr-card>button{width:100%}.qr-dialog .actions{flex-direction:column}.qr-dialog .dialog-head h2{font-size:1.05rem}}
@media print{
  body.qr-printing{background:#fff!important;color:#000!important}
  body.qr-printing #app>:not(#qrPrintSheet){display:none!important}
  body.qr-printing dialog::backdrop{display:none!important;background:transparent!important}
  body.qr-printing #qrPrintSheet{display:block!important;position:static;width:100%;max-width:170mm;margin:0 auto;padding:15mm 5mm;background:#fff;color:#000;text-align:center;break-inside:avoid}
  body.qr-printing #qrPrintSheet h1{font-size:28pt;margin:0 0 8mm;color:#000}
  body.qr-printing #qrPrintSheet p{font-size:13pt;margin:4mm 0;line-height:1.5}
  body.qr-printing #qrPrintSheet .qr-code{width:90mm;max-width:100%;margin:8mm auto}
  body.qr-printing #qrPrintSheet .qr-url{font-size:10pt;color:#000;text-decoration:none;margin:6mm 0;overflow-wrap:anywhere}
  body.qr-printing #qrPrintSheet .qr-print-note{font-size:10pt}
}

.video-panel{display:flex;flex-direction:column;gap:8px;width:100%;height:100%;min-height:300px;padding:10px;background:#071d32;border-radius:10px}
.video-frame{flex:1;min-height:220px;position:relative;background:#000}
.video-frame iframe,.video-frame video{display:block;width:100%;height:100%;min-height:220px;border:0;object-fit:contain;background:#000}
.video-frame iframe{position:absolute;inset:0}
.video-note{color:#c8dbe6;font-size:.78rem;line-height:1.4;margin:0}
.media-item .video-panel{height:auto}.media-item .video-frame{height:360px;flex:none}.media-item .video-frame video{margin:0;max-height:none}
@media(max-width:650px){.media-item .video-frame{height:240px}}

/* Laisser le défilement se poursuivre dans la page sur les écrans tactiles. */
@media (any-pointer:coarse), (max-width:650px){
  .viewport,.side{overscroll-behavior:auto}
}
@media (max-width:650px){
  .side{overflow:visible}
  /* Une barre d’adresse qui se replie ne doit pas redimensionner la photo. */
  .viewport{height:54vh;height:54svh}
}
.viewport.touch-drag-enabled .editor-zone{touch-action:none}
@media (pointer:coarse){
  .viewport:not(.touch-drag-enabled) .editor-zone{cursor:pointer}
  .viewport:not(.touch-drag-enabled) .resize-handle{display:none}
}

          } else {
            _modules[row + r][col + c] = false;
          }

      var pattern = 0;

        var b0 = bin.read();

        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;

      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);

<script id="q310-core">
const Q310Core=(()=>{

  const text=(x,max=4000)=>typeof x==='string'?x.slice(0,max):'';

  const FILE_LIMIT=10*1024*1024,TOTAL_FILE_LIMIT=16*1024*1024;
  const FILE_TYPES={jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',pdf:'application/pdf',doc:'application/msword',docx:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'};

  }
  function videoInfo(value){

      const embed=new URL('https://player.vimeo.com/video/'+id);embed.searchParams.set('playsinline','1');embed.searchParams.set('dnt','1');if(hash)embed.searchParams.set('h',hash);

  }

  function media(m={}){
    const out={images:[],videos:[],documents:[]};
    for(const kind of Object.keys(out)){
      if(m[kind]!==undefined&&!Array.isArray(m[kind]))throw Error('Liste de médias invalide.');

  }
  function validate(input){

      if(!Array.isArray(raw.zones)||raw.zones.length>1000)throw Error('Zones invalides.');

  }

<script id="q310-storage">
const Q310Storage=(()=>{
  let database;
  function open(){
    if(!database)database=new Promise((resolve,reject)=>{
      if(!globalThis.indexedDB){reject(Error('Stockage indisponible.'));return;}
      const request=indexedDB.open('q310-projects-with-files',1);
      request.onupgradeneeded=()=>{if(!request.result.objectStoreNames.contains('projects'))request.result.createObjectStore('projects');};
      request.onsuccess=()=>{request.result.onversionchange=()=>request.result.close();resolve(request.result);};
      request.onerror=()=>reject(request.error||Error('Stockage indisponible.'));
      request.onblocked=()=>reject(Error('Ferme les autres onglets de cette application pour autoriser la sauvegarde.'));
    });
    return database;
  }
  async function read(key){
    const db=await open();return new Promise((resolve,reject)=>{
      const tx=db.transaction('projects','readonly'),request=tx.objectStore('projects').get(key);
      request.onsuccess=()=>resolve(request.result||null);request.onerror=()=>reject(request.error);
    });
  }
  async function write(entries){
    const db=await open();return new Promise((resolve,reject)=>{
      const tx=db.transaction('projects','readwrite'),store=tx.objectStore('projects');
      for(const [key,value] of entries)store.put(value,key);
      tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error||Error('Sauvegarde impossible.'));tx.onabort=()=>reject(tx.error||Error('Sauvegarde interrompue.'));
    });
  }
  return {read,write};
})();

</script>

async function importMediaFiles(event){

// Le QR partage l'adresse publiée, jamais le brouillon local ni un fichier file://.
let qrShare=null;
function publicAppUrl(){
  const current=new URL(window.location.href);
  const localHost=/^(localhost|127(?:\.\d{1,3}){3}|0\.0\.0\.0|\[::1\])$/i.test(current.hostname);
  const url=/^https?:$/.test(current.protocol)&&!localHost?new URL('.',current.href):new URL(seed.assetBase);
  url.search='';url.hash='';
  return url.href;
}
function openQr(){
  if(!editor)return;
  try{
    const url=publicAppUrl();
    const code=qrcode(0,'M');code.addData(url,'Byte');code.make();
    const markup=code.createSvgTag({cellSize:8,margin:32,scalable:true});
    $('qrCode').innerHTML=markup;
    const svg=$('qrCode').firstElementChild;
    svg.setAttribute('role','img');svg.setAttribute('aria-label','Code QR pour ouvrir l’application Quincy Q310');svg.setAttribute('shape-rendering','crispEdges');
    $('qrPrintCode').replaceChildren(svg.cloneNode(true));
    $('qrUrl').href=url;$('qrUrl').textContent=url;$('qrPrintUrl').textContent=url;
    qrShare={url,code};showDialog('qrDialog');
  }catch(e){toast('Le code QR n’a pas pu être créé. Recharge la page et réessaie.',true);}
}
function printQr(){
  if(!editor||!qrShare)return;
  // Une fiche dédiée évite les fenêtres bloquées et les copies de canvas vides.
  document.body.classList.add('qr-printing');
  try{window.print();}
  catch(e){document.body.classList.remove('qr-printing');toast('Impression indisponible. Tu peux télécharger le code QR en PNG.',true);}
}
function downloadQr(){
  if(!editor||!qrShare)return;
  try{
    const code=qrShare.code,modules=code.getModuleCount(),scale=24,quiet=4;
    const canvas=document.createElement('canvas');canvas.width=canvas.height=(modules+2*quiet)*scale;
    const ctx=canvas.getContext('2d');if(!ctx)throw Error('Canvas indisponible.');
    ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#000';
    for(let row=0;row<modules;row++)for(let col=0;col<modules;col++)if(code.isDark(row,col))ctx.fillRect((col+quiet)*scale,(row+quiet)*scale,scale,scale);
    canvas.toBlob(blob=>{
      if(!blob){toast('Le téléchargement a échoué. Utilise le bouton Imprimer.',true);return;}
      download('Code_QR_Quincy_Q310.png',blob,'image/png');
    },'image/png');
  }catch(e){toast('Le téléchargement a échoué. Utilise le bouton Imprimer.',true);}
}
function bindQr(){
  $('openQrBtn').onclick=openQr;
  $('closeQrBtn').onclick=()=>closeDialog('qrDialog');
  $('printQrBtn').onclick=printQr;$('downloadQrBtn').onclick=downloadQr;
  $('qrDialog').addEventListener('close',()=>document.body.classList.remove('qr-printing'));
  window.addEventListener('beforeprint',()=>{if(editor&&$('qrDialog').open&&qrShare)document.body.classList.add('qr-printing');});
  window.addEventListener('afterprint',()=>document.body.classList.remove('qr-printing'));
}

    const numbers=el('div','grid2'),inputs={};for(const [key,label] of [['x','Gauche (%)'],['y','Haut (%)'],['w','Largeur (%)'],['h','Hauteur (%)']]){const sub=el('div');inputs[key]=field(sub,label,+(z[key]*100).toFixed(2),'number');inputs[key].step='.1';inputs[key].min='0';inputs[key].max='100';numbers.append(sub);}section.append(numbers,btn('Appliquer les dimensions',()=>{const next=Object.fromEntries(Object.entries(inputs).map(([k,v])=>[k,Number(v.value)/100]));if(!Object.values(next).every(Number.isFinite)||next.x<0||next.y<0||next.w<=0||next.h<=0||next.x+next.w>1.000001||next.y+next.h>1.000001){toast('Le repère doit rester à l’intérieur de l’image.',true);return;}change(()=>Object.assign(z,next));},'full'));
    section.append(btn('Supprimer ce repère',()=>{if(confirm('Supprimer ce repère du brouillon ? La commande Annuler permettra de le rétablir.'))change(()=>{view().zones=view().zones.filter(x=>x.id!==z.id);selectedZoneId='';});},'full danger'));box.append(section);
  }
  const p=part();if(p){const section=el('section','teacher-section');section.append(el('h3','','Modifier la fiche'));const name=field(section,'Nom',p.nom),role=field(section,'Rôle',p.role),desc=field(section,'Explication',p.desc,'textarea');const group=el('select');group.setAttribute('aria-label','Famille de la pièce');group.append(option('','Autre'));Object.entries(GROUPS).forEach(([k,v])=>group.append(option(k,v)));if(p.circuit&&!GROUPS[p.circuit])group.append(option(p.circuit,p.circuit));group.value=p.circuit;section.append(el('label','','Famille'),group,btn('Enregistrer la fiche',async()=>{if(!name.value.trim())return toast('Donne un nom à cette pièce.',true);if(await change(()=>Object.assign(p,{nom:name.value.trim(),role:role.value.trim(),desc:desc.value.trim(),circuit:group.value})))toast('Fiche enregistrée.');},'full'));
    const mediaSelect=el('select');mediaSelect.setAttribute('aria-label','Choisir un média à associer');mediaSelect.append(option('','Choisir une photo, vidéo ou document'));for(const v of project.views)mediaSelect.append(option(v.src,v.label));mediaSelect.append(option('actif/Piston_rod.docx','Document — Piston et bielle'));for(const [id,file] of Object.entries(project.attachments))mediaSelect.append(option('q310-file:'+id,file.name));section.append(el('label','','Médias de la fiche'),mediaSelect,btn('Associer ce média',()=>{if(!mediaSelect.value)return;const src=mediaSelect.value,kind=mediaKind(src);if(p.medias[kind].includes(src))return toast('Ce média est déjà associé.');change(()=>p.medias[kind].push(src));},'full'));
    const mediaList=el('ul','filelist');for(const kind of Object.keys(p.medias))for(const src of p.medias[kind]){const li=el('li','',mediaName(src)+' ');li.append(btn('Retirer',()=>change(()=>p.medias[kind]=p.medias[kind].filter(x=>x!==src))));mediaList.append(li);}section.append(mediaList);appendMediaImporter(section,p);box.append(section);
  }
  box.append(btn('Créer une nouvelle fiche',()=>{const nom=prompt('Nom du composant :');if(!nom?.trim())return;change(()=>{const p={id:'piece_'+C.uid(),nom:nom.trim(),role:'',desc:'',circuit:'',medias:{images:[],videos:[],documents:[]}};project.parts.push(p);selectedPartId=p.id;if(zone())zone().partId=p.id;tabName='fiche';});},'full'));
}
function showMedia(p){
  $('mediaTitle').textContent=p.nom;const box=$('mediaContent');box.replaceChildren();let count=0;
  for(const kind of ['images','videos','documents'])for(const src of p.medias[kind]){
    count++;const block=el('div','media-item'),file=project.attachments[C.fileId(src)];block.append(el('p','muted',mediaName(src)));
    if(kind==='documents'){
      const a=el('a','button',file?'Télécharger le document':'Ouvrir le document');a.href=asset(src);a.target='_blank';a.rel='noopener noreferrer';if(file)a.download=file.name;block.append(a);
      if(file?.mime==='application/pdf'){const open=el('a','button','Ouvrir le PDF');open.href=asset(src);open.target='_blank';open.rel='noopener noreferrer';open.style.marginLeft='8px';block.append(open);}
    }else if(kind==='videos'){
      try{block.append(videoPanel(src,mediaName(src)));}catch(e){block.append(el('p','media-error',e.message));}
    }else{
      const item=el(kind==='images'?'img':'video');item.src=asset(src);
      if(kind==='images'){item.alt=file?.name||p.nom;item.loading='lazy';}else{item.controls=true;item.playsInline=true;item.preload='metadata';item.onplay=()=>{box.querySelectorAll('video').forEach(v=>{if(v!==item)v.pause();});};}
      item.onerror=()=>{item.hidden=true;block.append(el('p','media-error','Média indisponible. Vérifie son adresse et la connexion.'));};block.append(item);
    }
    box.append(block);
  }
  if(!count)box.append(el('p','empty','Aucun média associé.'));showDialog('mediaDialog');
}

function appendAirGuide(box){
  const guide=el('section','air-guide');guide.append(el('h2','','Cheminement de l’air — Quincy 310 L'),el('p','','Le même air est comprimé deux fois : dans le gros cylindre basse pression (BP), puis dans le petit cylindre haute pression (HP). Les étapes ci-dessous suivent son trajet; les deux pistons travaillent pendant la rotation du vilebrequin.'));
  const steps=[
    ['1. Entrée de l’air : filtre et silencieux','Le filtre à air retient les poussières avant leur entrée dans le compresseur. Le silencieux, si installé, atténue le bruit d’aspiration. L’air est encore à une pression voisine de celle de l’atmosphère.'],
    ['2. Admission dans le cylindre BP','En descendant, le piston augmente le volume du cylindre. Lorsque la pression intérieure devient inférieure à celle de l’admission, la soupape d’admission BP s’ouvre et l’air entre. La soupape de refoulement reste fermée.'],
    ['3. Première compression et refoulement BP','En remontant, le piston réduit le volume de l’air. La soupape d’admission se ferme; la pression et la température augmentent. Lorsque la pression du cylindre dépasse celle du circuit intermédiaire, la soupape de refoulement BP s’ouvre. L’air quitte le premier étage.'],
    ['4. Refroidissement entre les deux étages','L’air traverse le refroidisseur intermédiaire (intercooler). Le tube et ses ailettes évacuent une partie de la chaleur vers l’air ambiant. Refroidir l’air réduit son volume pour une même masse à pression comparable et diminue le travail nécessaire au deuxième étage. Ce composant refroidit : il ne réalise pas une deuxième compression.'],
    ['5. Admission puis compression HP','Le piston HP aspire l’air du refroidisseur à travers sa soupape d’admission. À la remontée, cette soupape se ferme et l’air est comprimé davantage. Le cylindre HP est plus petit parce que l’air, déjà comprimé, occupe moins de volume.'],
    ['6. Refoulement HP vers le réservoir','Lorsque la pression du cylindre HP dépasse celle de la conduite de sortie, sa soupape de refoulement s’ouvre. L’air passe dans la conduite, puis vers le réservoir par le clapet antiretour. Ce clapet empêche le réservoir de se vider à rebours dans le compresseur. Un refroidisseur final (aftercooler), s’il est installé sur la conduite, retire encore de la chaleur après le deuxième étage.'],
    ['7. Stockage et utilisation','Le réservoir accumule l’air comprimé et atténue les pulsations. Son manomètre indique la pression disponible. En refroidissant, une partie de la vapeur d’eau contenue dans l’air se condense : la purge au bas du réservoir permet d’évacuer ce liquide. La vanne de sortie alimente le réseau; le régulateur de pression, s’il est installé, adapte la pression à l’utilisation.']
  ];
  for(const [title,body] of steps){guide.append(el('h3','',title),el('p','',body));}
  guide.append(el('h3','','Ce qui fait bouger les pistons'),el('p','','Le moteur entraîne sa poulie, les courroies et la poulie-volant du compresseur. Le vilebrequin et les bielles transforment la rotation en mouvement alternatif des pistons. Les segments limitent les fuites entre piston et cylindre; les joints assurent l’étanchéité des assemblages. Les ailettes des cylindres et la ventilation contribuent au refroidissement. La tension des courroies se règle par le montage du moteur ou le dispositif prévu, selon l’installation.'));
  guide.append(el('h3','','Le circuit d’huile travaille en parallèle'),el('p','','Le carter contient l’huile. La pompe aspire l’huile à travers une crépine, puis l’envoie sous pression vers les passages de lubrification; un filtre retient les impuretés si le montage en possède un. La régulation d’huile contrôle la pression du circuit, lue au manomètre d’huile. L’huile réduit le frottement et l’usure des organes mobiles. Ce circuit n’est pas une étape du trajet de l’air vers le réservoir.'));
  guide.append(el('h3','','Démarrage, arrêt et décharge — version L'),el('p','','Le pressostat surveille la pression du réservoir : au seuil bas, il commande le démarrage du moteur; au seuil haut, il commande son arrêt. Les seuils dépendent du réglage de l’installation.'),el('p','','Le déchargeur hydraulique permet un démarrage à vide, avant l’établissement de la pression d’huile. Les déchargeurs d’admission maintiennent alors les soupapes d’admission ouvertes : les pistons se déplacent, mais ne produisent pas normalement d’air comprimé vers le réservoir. Une fois la pression d’huile établie, la compression peut commencer. Une perte de pression d’huile provoque également la décharge; cela ne signifie pas nécessairement que le moteur s’arrête.'),el('p','','La valve pilote concerne les configurations qui en sont équipées, notamment LS/LVD : elle commande la mise en charge et à vide selon la pression du réservoir. Elle n’est pas à supposer présente sur la version L standard.'));
  guide.append(el('h3','','Soupapes : trois rôles à distinguer'),el('p','','Les soupapes d’admission et de refoulement orientent l’air à chaque course du piston, grâce aux différences de pression. Les déchargeurs empêchent temporairement la compression. Les soupapes de sûreté protègent contre une surpression anormale dans la partie du circuit qu’elles protègent : elles ne servent pas à réguler le fonctionnement normal.'),el('p','note','À retenir : l’air suit BP → refroidisseur intermédiaire → HP → clapet antiretour → réservoir. La transmission fournit le mouvement, l’huile protège les pièces mobiles et la commande adapte la production à la demande.'));
  guide.append(el('p','muted','Repères documentaires : manuel de pièces 50214-106 (février 2008), p. 15 et 17 pour le bloc et les soupapes, p. 19 pour la commande L; manuel d’instructions QR-25 52201-107, section « System dynamics ». Les accessoires dépendent de l’installation.'));
  box.append(guide);
}
function openHelp(){const box=$('helpContent');box.replaceChildren();appendAirGuide(box);const usage=el('details','');usage.append(el('summary','','Comment utiliser l’application'));const list=el('ol','help-list');for(const txt of ['Choisis une vue dans le menu, puis clique directement sur une pièce de la photo. En mode élève, les cadres et numéros sont invisibles, mais les zones restent cliquables.','Ouvre « Toutes les pièces » pour rechercher un composant ou filtrer une famille.','Utilise + et − pour agrandir la photo. Fais défiler l’image agrandie; « Ajuster » rétablit la vue complète.','Le bouton « Photos et documents » apparaît lorsqu’une fiche possède des médias.','Le bouton « Manuel PDF » ouvre le manuel de pièces Quincy QR-25 modèle 310, révision 106, dans un nouvel onglet.'])list.append(el('li','',txt));usage.append(list);if(editor)box.append(usage);
  if(editor){box.append(el('h3','','Pour l’enseignant'),el('p','','Le mode enseignant prépare un brouillon sur cet appareil. « Sauvegarder le projet complet » crée un fichier JSON réutilisable. « Créer la page élèves » crée un fichier index.html qui contient le contenu préparé et démarre en consultation. Le code d’accès permet de retrouver le mode enseignant.'),el('p','note','La page élèves et la sauvegarde contiennent les liens des photos, vidéos et documents. Les médias restent hébergés sur ton site GitHub : une connexion Internet est nécessaire.'));}
  box.append(el('p','muted','Les fiches générales doivent être adaptées aux composants présents sur la machine de l’atelier. Référence technique intégrée : manuel Quincy QR-25 modèle 310, Record of Change 106, édition février 2008.'));showDialog('helpDialog');}
function renderRecovery(){const box=$('recoveryNotice');box.replaceChildren();box.hidden=true;if(config.readonly||!editor)return;try{if(localStorage.getItem('q310_views_v1')){box.hidden=false;box.append(el('p','','Des annotations de l’ancienne application sont présentes sur cet appareil.'),btn('Récupérer mes annotations',recoverLocal));}}catch(e){}}
async function onImport(e){requireEditor();const f=e.target.files[0];if(!f)return;try{if(f.size>24*1024*1024)throw Error('Ce projet dépasse 24 Mo.');const raw=JSON.parse(await f.text());if(Array.isArray(raw)){await prepareLegacy({views:{[currentId]:{...C.clone(view()),zones:raw}},parts:[]});return;}if(raw.format==='q310-legacy-backup'){await prepareLegacy(raw);return;}const next=C.validate(raw);importCandidate=next;$('importSummary').textContent=`Ce fichier contient ${next.views.length} vues, ${next.parts.length} fiches et ${next.views.reduce((s,v)=>s+v.zones.length,0)} repères.`;showDialog('importDialog');}catch(e){toast('Import refusé : '+e.message,true);}}
async function replaceProject(next){
  requireEditor();const checked=C.validate(next);checked.updatedAt=new Date(Math.max(Date.now(),(Date.parse(project.updatedAt)||0)+1,(Date.parse(checked.updatedAt)||0)+1)).toISOString();const previous=C.clone(project);
  await saveQueue;
  try{await storeSnapshot(checked,previous);}catch(e){throw Error('Import non appliqué : sauvegarde locale impossible. Le brouillon actuel est conservé.');}
  checkpoint();previousDraft=previous;project=checked;saveRevision++;cleanAttachmentUrls();currentId=project.views[0].id;history=[];selectedZoneId='';selectedPartId='';
  $('saveState').textContent='Brouillon enregistré sur cet appareil, fichiers joints inclus.';renderStage();renderSide();
}
async function applyImport(){
  if(!importCandidate)return;const button=$('confirmImport');if(button.disabled)return;button.disabled=true;
  try{await replaceProject(importCandidate);importCandidate=null;closeDialog('importDialog');toast('Projet importé, fichiers joints inclus.');}catch(e){toast(e.message,true);}finally{button.disabled=false;}
}

function recoverLocal(){requireEditor();try{const raw=localStorage.getItem('q310_views_v1');if(!raw)return toast('Aucune ancienne annotation dans ce navigateur. Ouvre cette V2 sur le même site et le même appareil que l’ancienne application, ou importe un ancien JSON.',true);const parts=JSON.parse(localStorage.getItem('q310_parts_v1')||'[]');prepareLegacy({format:'q310-legacy-backup',views:JSON.parse(raw),parts});}catch(e){toast('Récupération impossible : '+e.message,true);}}
let legacySession=null;
async function prepareLegacy(raw){
  requireEditor();if(busy)return;busy=true;try{
    if(!raw.views||typeof raw.views!=='object'||Array.isArray(raw.views)||!Array.isArray(raw.parts))throw Error('Anciennes données invalides.');
    const entries=Object.entries(raw.views);if(entries.length>100)throw Error('Trop de vues.');const session={raw:C.clone(raw),rows:[]};const box=$('legacyViews');box.replaceChildren();$('legacyError').textContent='';showDialog('legacyDialog');$('legacyApply').disabled=true;
    for(const [id,v] of entries){if(!v||!Array.isArray(v.zones)||v.zones.length>1000)throw Error('Une ancienne vue est invalide.');const known=project.views.find(x=>x.id===id)||seed.views.find(x=>x.id===id);if(!v.zones.length)continue;if(v.type==='video')continue;const src=C.source(v.src||known?.src||'');const section=el('section','calibration');section.append(el('h3','',known?.label||id));const input=field(section,'Largeur de l’image lors du dessin (pixels)',390,'number');input.min='1';input.max='10000';input.step='1';const wrap=el('div','cal-image'),img=el('img'),overlay=el('div','cal-overlay');img.alt='Aperçu des anciens repères';wrap.append(img,overlay);section.append(wrap);box.append(section);
      const ratio=await new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(Error('Image trop lente à charger : '+src)),20000);img.onload=()=>{clearTimeout(timer);resolve(img.naturalHeight/img.naturalWidth);};img.onerror=()=>{clearTimeout(timer);reject(Error('Image introuvable : '+src));};img.src=asset(src);});
      let minWidth=1;for(const z of v.zones){const vals=['x','y','w','h'].map(k=>Number(z[k]));if(!vals.every(Number.isFinite)||vals[0]<0||vals[1]<0||vals[2]<=0||vals[3]<=0)throw Error('Une ancienne zone a des dimensions invalides; les données originales restent intactes.');minWidth=Math.max(minWidth,vals[0]+vals[2],(vals[1]+vals[3])/ratio);}input.value=String(Math.ceil(Math.max(390,minWidth)));const row={id,label:known?.label||id,src,zones:v.zones,input,ratio};session.rows.push(row);
      const preview=()=>{overlay.replaceChildren();const w=Number(input.value),h=w*ratio;if(!(w>0))return;v.zones.forEach((z,i)=>{const r=el('div','cal-zone');Object.assign(r.style,{left:100*z.x/w+'%',top:100*z.y/h+'%',width:100*z.w/w+'%',height:100*z.h/h+'%'});r.append(el('span','',String(i+1)));overlay.append(r);});};input.oninput=preview;preview();
    }
    if(!session.rows.length&&raw.parts.length===0)throw Error('Aucune annotation ou fiche à récupérer.');legacySession=session;$('legacyApply').disabled=false;
    $('legacyBackup').onclick=()=>download('q310_anciennes_annotations.json',JSON.stringify(raw,null,2),'application/json');$('legacyApply').onclick=applyLegacy;
  }catch(e){$('legacyError').textContent=e.message;toast(e.message,true);}finally{busy=false;}
}
async function applyLegacy(){try{requireEditor();if(!legacySession)return;const s=legacySession,next=C.clone(project);next.legacyArchive=s.raw;
  for(const p of s.raw.parts){if(!p||!p.id)continue;const idx=next.parts.findIndex(x=>x.id===p.id);const fixed={...p,medias:C.media(p.medias)};if(idx>=0)next.parts[idx]=fixed;else next.parts.push(fixed);}
  for(const row of s.rows){const width=Number(row.input.value),height=width*row.ratio;const zones=row.zones.map(z=>{const n=C.normalizeLegacyZone(z,width,height);if(!n.partId&&next.parts.some(p=>p.id===z.id))n.partId=z.id;return n;});let target=next.views.find(v=>v.id===row.id);if(!target){target={id:row.id,label:row.label,type:'image',src:row.src,zones:[]};next.views.push(target);}target.zones=zones;target.src=row.src;}
  // Preserve linked views even when they contained no annotations.
  for(const [id,v] of Object.entries(s.raw.views)){if(next.views.some(x=>x.id===id))continue;const known=seed.views.find(x=>x.id===id);if(v.src||known)next.views.push({id,label:known?.label||id,type:v.type||known?.type||'image',src:C.source(v.src||known.src),zones:[]});}
  await replaceProject(next);closeDialog('legacyDialog');toast('Annotations récupérées. Vérifie leur position sur chaque vue, puis sauvegarde le projet.');
}catch(e){$('legacyError').textContent=e.message;}}
build();setMode(false);renderStage();renderSide();if(initialWarning)toast(initialWarning,true);
})();
</script>
