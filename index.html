function renderTeacher(){const box=$('teacherTools');box.hidden=!editor;box.replaceChildren();if(!editor)return;
  const main=el('section','teacher-section');main.append(el('h3','','Préparer le cours'),el('p','muted','Le brouillon reste sur cet appareil. Crée la page élèves pour partager ton contenu.'));
  main.append(btn('Sauvegarder le projet complet',exportProject,'full primary'),btn('Importer un projet',()=>{$('importFile').value='';$('importFile').click();},'full'),btn('Créer la page élèves',exportPage,'full'),btn('Récupérer les anciennes annotations',recoverLocal,'full'));
  try{if(localStorage.getItem(PREVIOUS_KEY))main.append(btn('Reprendre le brouillon précédent',()=>{try{importCandidate=C.validate(JSON.parse(localStorage.getItem(PREVIOUS_KEY)));$('importSummary').textContent='Reprendre le brouillon conservé avant le dernier import.';showDialog('importDialog');}catch(e){toast('Brouillon précédent indisponible : '+e.message,true);}},'full'));}catch(e){}
  const undoBtn=btn('Annuler la dernière modification',()=>{requireEditor();if(!undo.length)return;project=undo.pop();if(!project.views.some(v=>v.id===currentId))currentId=project.views[0].id;selectedZoneId='';selectedPartId='';save();renderStage();renderSide();},'full');undoBtn.disabled=!undo.length;main.append(undoBtn);box.append(main);
  if(view().type==='image')main.append(btn('Ajouter un repère sur cette vue',()=>change(()=>{const z={id:C.uid(),x:.4,y:.4,w:.16,h:.15,partId:selectedPartId,linkedViewId:'',nom:'',role:'',desc:''};view().zones.push(z);selectedZoneId=z.id;tabName='fiche';}),'full'));
  const z=zone();if(z){const section=el('section','teacher-section');section.append(el('h3','','Repère sélectionné'));const label=el('label','','Pièce associée'),select=el('select');select.setAttribute('aria-label','Pièce associée au repère');select.append(option('','Aucune pièce'));project.parts.forEach(p=>select.append(option(p.id,p.nom)));select.value=z.partId;select.onchange=()=>change(()=>{z.partId=select.value;selectedPartId=z.partId;});section.append(label,select);
    const link=el('select');link.setAttribute('aria-label','Vue associée au repère');link.append(option('','Aucune vue'));project.views.filter(v=>v.id!==currentId).forEach(v=>link.append(option(v.id,v.label)));link.value=z.linkedViewId;link.onchange=()=>change(()=>z.linkedViewId=link.value);section.append(el('label','','Vue associée'),link);
    const numbers=el('div','grid2'),inputs={};for(const [key,label] of [['x','Gauche (%)'],['y','Haut (%)'],['w','Largeur (%)'],['h','Hauteur (%)']]){const sub=el('div');inputs[key]=field(sub,label,+(z[key]*100).toFixed(2),'number');inputs[key].step='.1';inputs[key].min='0';inputs[key].max='100';numbers.append(sub);}section.append(numbers,btn('Appliquer les dimensions',()=>{const next=Object.fromEntries(Object.entries(inputs).map(([k,v])=>[k,Number(v.value)/100]));if(!Object.values(next).every(Number.isFinite)||next.x<0||next.y<0||next.w<=0||next.h<=0||next.x+next.w>1.000001||next.y+next.h>1.000001){toast('Le repère doit rester à l’intérieur de l’image.',true);return;}change(()=>Object.assign(z,next));},'full'));
    section.append(btn('Supprimer ce repère',()=>{if(confirm('Supprimer ce repère du brouillon ? La commande Annuler permettra de le rétablir.'))change(()=>{view().zones=view().zones.filter(x=>x.id!==z.id);selectedZoneId='';});},'full danger'));box.append(section);
  }
  const p=part();if(p){const section=el('section','teacher-section');section.append(el('h3','','Modifier la fiche'));const name=field(section,'Nom',p.nom),role=field(section,'Rôle',p.role),desc=field(section,'Explication',p.desc,'textarea');const group=el('select');group.setAttribute('aria-label','Famille de la pièce');group.append(option('','Autre'));Object.entries(GROUPS).forEach(([k,v])=>group.append(option(k,v)));if(p.circuit&&!GROUPS[p.circuit])group.append(option(p.circuit,p.circuit));group.value=p.circuit;section.append(el('label','','Famille'),group,btn('Enregistrer la fiche',()=>{if(!name.value.trim())return toast('Donne un nom à cette pièce.',true);if(change(()=>Object.assign(p,{nom:name.value.trim(),role:role.value.trim(),desc:desc.value.trim(),circuit:group.value})))toast('Fiche enregistrée.');},'full'));
    const mediaSelect=el('select');mediaSelect.setAttribute('aria-label','Choisir un média à associer');mediaSelect.append(option('','Choisir une photo, vidéo ou document'));for(const v of project.views)mediaSelect.append(option(v.src,v.label));mediaSelect.append(option('actif/Piston_rod.docx','Document — Piston et bielle'));section.append(el('label','','Médias de la fiche'),mediaSelect,btn('Associer ce média',()=>{if(!mediaSelect.value)return;const src=mediaSelect.value,kind=/\.mp4$/i.test(src)?'videos':/\.docx$/i.test(src)?'documents':'images';if(p.medias[kind].includes(src))return toast('Ce média est déjà associé.');change(()=>p.medias[kind].push(src));},'full'));
    const mediaList=el('ul','filelist');for(const kind of Object.keys(p.medias))for(const src of p.medias[kind]){const li=el('li','',src.split('/').pop()+' ');li.append(btn('Retirer',()=>change(()=>p.medias[kind]=p.medias[kind].filter(x=>x!==src))));mediaList.append(li);}section.append(mediaList);box.append(section);
  }
  box.append(btn('Créer une nouvelle fiche',()=>{const nom=prompt('Nom du composant :');if(!nom?.trim())return;change(()=>{const p={id:'piece_'+C.uid(),nom:nom.trim(),role:'',desc:'',circuit:'',medias:{images:[],videos:[],documents:[]}};project.parts.push(p);selectedPartId=p.id;if(zone())zone().partId=p.id;tabName='fiche';});},'full'));
}
function showMedia(p){$('mediaTitle').textContent=p.nom;const box=$('mediaContent');box.replaceChildren();let count=0;for(const kind of ['images','videos','documents'])for(const src of p.medias[kind]){count++;const block=el('div','media-item');block.append(el('p','muted',src.split('/').pop()));if(kind==='documents'){const a=el('a','button','Ouvrir le document');a.href=asset(src);a.target='_blank';a.rel='noopener noreferrer';block.append(a);}else{const item=el(kind==='images'?'img':'video');item.src=asset(src);if(kind==='images'){item.alt=p.nom;item.loading='lazy';}else{item.controls=true;item.playsInline=true;item.preload='metadata';item.onplay=()=>{box.querySelectorAll('video').forEach(v=>{if(v!==item)v.pause();});};}item.onerror=()=>{item.hidden=true;block.append(el('p','media-error','Média indisponible. Vérifie son adresse et la connexion.'));};block.append(item);}box.append(block);}if(!count)box.append(el('p','empty','Aucun média associé.'));showDialog('mediaDialog');}
function appendAirGuide(box){
  const guide=el('section','air-guide');guide.append(el('h2','','Cheminement de l’air — Quincy 310 L'),el('p','','Le même air est comprimé deux fois : dans le gros cylindre basse pression (BP), puis dans le petit cylindre haute pression (HP). Les étapes ci-dessous suivent son trajet; les deux pistons travaillent pendant la rotation du vilebrequin.'));
  const steps=[
    ['1. Entrée de l’air : filtre et silencieux','Le filtre à air retient les poussières avant leur entrée dans le compresseur. Le silencieux, si installé, atténue le bruit d’aspiration. L’air est encore à une pression voisine de celle de l’atmosphère.'],
    ['2. Admission dans le cylindre BP','En descendant, le piston augmente le volume du cylindre. Lorsque la pression intérieure devient inférieure à celle de l’admission, la soupape d’admission BP s’ouvre et l’air entre. La soupape de refoulement reste fermée.'],
    ['3. Première compression et refoulement BP','En remontant, le piston réduit le volume de l’air. La soupape d’admission se ferme; la pression et la température augmentent. Lorsque la pression du cylindre dépasse celle du circuit intermédiaire, la soupape de refoulement BP s’ouvre. L’air quitte le premier étage.'],
    ['4. Refroidissement entre les deux étages','L’air traverse le refroidisseur intermédiaire (intercooler). Le tube et ses ailettes évacuent une partie de la chaleur vers l’air ambiant. Refroidir l’air réduit son volume pour une même masse à pression comparable et diminue le travail nécessaire au deuxième étage. Ce composant refroidit : il ne réalise pas une deuxième compression.'],
    ['5. Admission puis compression HP','Le piston HP aspire l’air du refroidisseur à travers sa soupape d’admission. À la remontée, cette soupape se ferme et l’air est comprimé davantage. Le cylindre HP est plus petit parce que l’air, déjà comprimé, occupe moins de volume.'],
    ['6. Refoulement HP vers le réservoir','Lorsque la pression du cylindre HP dépasse celle de la conduite de sortie, sa soupape de refoulement s’ouvre. L’air passe dans la conduite, puis vers le réservoir par le clapet antiretour. Ce clapet empêche le réservoir de se vider à rebours dans le compresseur. Un refroidisseur final (aftercooler), s’il est installé sur la conduite, retire encore de la chaleur après le deuxième étage.'],
    ['7. Stockage et utilisation','Le réservoir accumule l’air comprimé et atténue les pulsations. Son manomètre indique la pression disponible. En refroidissant, une partie de la vapeur d’eau contenue dans l’air se condense : la purge au bas du réservoir permet d’évacuer ce liquide. La vanne de sortie alimente le réseau; le régulateur de pression, s’il est installé, adapte la pression à l’utilisation.']
  ];
  for(const [title,body] of steps){guide.append(el('h3','',title),el('p','',body));}
  guide.append(el('h3','','Ce qui fait bouger les pistons'),el('p','','Le moteur entraîne sa poulie, les courroies et la poulie-volant du compresseur. Le vilebrequin et les bielles transforment la rotation en mouvement alternatif des pistons. Les segments limitent les fuites entre piston et cylindre; les joints assurent l’étanchéité des assemblages. Les ailettes des cylindres et la ventilation contribuent au refroidissement. La tension des courroies se règle par le montage du moteur ou le dispositif prévu, selon l’installation.'));
  guide.append(el('h3','','Le circuit d’huile travaille en parallèle'),el('p','','Le carter contient l’huile. La pompe aspire l’huile à travers une crépine, puis l’envoie sous pression vers les passages de lubrification; un filtre retient les impuretés si le montage en possède un. La régulation d’huile contrôle la pression du circuit, lue au manomètre d’huile. L’huile réduit le frottement et l’usure des organes mobiles. Ce circuit n’est pas une étape du trajet de l’air vers le réservoir.'));
  guide.append(el('h3','','Démarrage, arrêt et décharge — version L'),el('p','','Le pressostat surveille la pression du réservoir : au seuil bas, il commande le démarrage du moteur; au seuil haut, il commande son arrêt. Les seuils dépendent du réglage de l’installation.'),el('p','','Le déchargeur hydraulique permet un démarrage à vide, avant l’établissement de la pression d’huile. Les déchargeurs d’admission maintiennent alors les soupapes d’admission ouvertes : les pistons se déplacent, mais ne produisent pas normalement d’air comprimé vers le réservoir. Une fois la pression d’huile établie, la compression peut commencer. Une perte de pression d’huile provoque également la décharge; cela ne signifie pas nécessairement que le moteur s’arrête.'),el('p','','La valve pilote concerne les configurations qui en sont équipées, notamment LS/LVD : elle commande la mise en charge et à vide selon la pression du réservoir. Elle n’est pas à supposer présente sur la version L standard.'));
  guide.append(el('h3','','Soupapes : trois rôles à distinguer'),el('p','','Les soupapes d’admission et de refoulement orientent l’air à chaque course du piston, grâce aux différences de pression. Les déchargeurs empêchent temporairement la compression. Les soupapes de sûreté protègent contre une surpression anormale dans la partie du circuit qu’elles protègent : elles ne servent pas à réguler le fonctionnement normal.'),el('p','note','À retenir : l’air suit BP → refroidisseur intermédiaire → HP → clapet antiretour → réservoir. La transmission fournit le mouvement, l’huile protège les pièces mobiles et la commande adapte la production à la demande.'));
  guide.append(el('p','muted','Repères documentaires : manuel de pièces 50214-106 (février 2008), p. 15 et 17 pour le bloc et les soupapes, p. 19 pour la commande L; manuel d’instructions QR-25 52201-107, section « System dynamics ». Les accessoires dépendent de l’installation.'));
  box.append(guide);
}
function openHelp(){const box=$('helpContent');box.replaceChildren();appendAirGuide(box);const usage=el('details','');usage.append(el('summary','','Comment utiliser l’application'));const list=el('ol','help-list');for(const txt of ['Choisis une vue dans le menu, puis clique directement sur une pièce de la photo. En mode élève, les cadres et numéros sont invisibles, mais les zones restent cliquables.','Ouvre « Toutes les pièces » pour rechercher un composant ou filtrer une famille.','Utilise + et − pour agrandir la photo. Fais défiler l’image agrandie; « Ajuster » rétablit la vue complète.','Le bouton « Photos et documents » apparaît lorsqu’une fiche possède des médias.','Le bouton « Manuel PDF » ouvre le manuel de pièces Quincy QR-25 modèle 310, révision 106, dans un nouvel onglet.'])list.append(el('li','',txt));usage.append(list);box.append(usage);
  if(!config.readonly){box.append(el('h3','','Pour l’enseignant'),el('p','','Le mode enseignant prépare un brouillon sur cet appareil. « Sauvegarder le projet complet » crée un fichier JSON réutilisable. « Créer la page élèves » crée un fichier index.html qui contient le contenu préparé, en consultation seulement.'),el('p','note','La page élèves et la sauvegarde contiennent les liens des photos, vidéos et documents. Les médias restent hébergés sur ton site GitHub : une connexion Internet est nécessaire.'));}
  box.append(el('p','muted','Les fiches générales doivent être adaptées aux composants présents sur la machine de l’atelier. Référence technique intégrée : manuel Quincy QR-25 modèle 310, Record of Change 106, édition février 2008.'));showDialog('helpDialog');}
function renderRecovery(){const box=$('recoveryNotice');box.replaceChildren();box.hidden=true;if(config.readonly||!editor)return;try{if(localStorage.getItem('q310_views_v1')){box.hidden=false;box.append(el('p','','Des annotations de l’ancienne application sont présentes sur cet appareil.'),btn('Récupérer mes annotations',recoverLocal));}}catch(e){}}
async function onImport(e){requireEditor();const f=e.target.files[0];if(!f)return;try{if(f.size>10*1024*1024)throw Error('Ce fichier dépasse 10 Mo.');const raw=JSON.parse(await f.text());if(Array.isArray(raw)){await prepareLegacy({views:{[currentId]:{...C.clone(view()),zones:raw}},parts:[]});return;}if(raw.format==='q310-legacy-backup'){await prepareLegacy(raw);return;}const next=C.validate(raw);importCandidate=next;$('importSummary').textContent=`Ce fichier contient ${next.views.length} vues, ${next.parts.length} fiches et ${next.views.reduce((s,v)=>s+v.zones.length,0)} repères.`;showDialog('importDialog');}catch(e){toast('Import refusé : '+e.message,true);}}
function replaceProject(next){requireEditor();const checked=C.validate(next);checked.updatedAt=new Date().toISOString();try{localStorage.setItem(PREVIOUS_KEY,JSON.stringify(project));localStorage.setItem(WORK_KEY,JSON.stringify(checked));}catch(e){throw Error('Import non appliqué : espace local insuffisant ou stockage indisponible. Le brouillon actuel est conservé. Sauvegarde-le avant de libérer de l’espace.');}checkpoint();project=checked;currentId=project.views[0].id;history=[];selectedZoneId='';selectedPartId='';$('saveState').textContent='Brouillon enregistré sur cet appareil.';renderStage();renderSide();}
function applyImport(){if(!importCandidate)return;try{replaceProject(importCandidate);importCandidate=null;closeDialog('importDialog');toast('Projet importé. Les médias sont conservés sous forme de liens.');}catch(e){toast(e.message,true);}}
function recoverLocal(){requireEditor();try{const raw=localStorage.getItem('q310_views_v1');if(!raw)return toast('Aucune ancienne annotation dans ce navigateur. Ouvre cette V2 sur le même site et le même appareil que l’ancienne application, ou importe un ancien JSON.',true);const parts=JSON.parse(localStorage.getItem('q310_parts_v1')||'[]');prepareLegacy({format:'q310-legacy-backup',views:JSON.parse(raw),parts});}catch(e){toast('Récupération impossible : '+e.message,true);}}
let legacySession=null;
async function prepareLegacy(raw){
  requireEditor();if(busy)return;busy=true;try{
    if(!raw.views||typeof raw.views!=='object'||Array.isArray(raw.views)||!Array.isArray(raw.parts))throw Error('Anciennes données invalides.');
    const entries=Object.entries(raw.views);if(entries.length>100)throw Error('Trop de vues.');const session={raw:C.clone(raw),rows:[]};const box=$('legacyViews');box.replaceChildren();$('legacyError').textContent='';showDialog('legacyDialog');$('legacyApply').disabled=true;
    for(const [id,v] of entries){if(!v||!Array.isArray(v.zones)||v.zones.length>1000)throw Error('Une ancienne vue est invalide.');const known=project.views.find(x=>x.id===id)||seed.views.find(x=>x.id===id);if(!v.zones.length)continue;if(v.type==='video')continue;const src=C.source(v.src||known?.src||'');const section=el('section','calibration');section.append(el('h3','',known?.label||id));const input=field(section,'Largeur de l’image lors du dessin (pixels)',390,'number');input.min='1';input.max='10000';input.step='1';const wrap=el('div','cal-image'),img=el('img'),overlay=el('div','cal-overlay');img.alt='Aperçu des anciens repères';wrap.append(img,overlay);section.append(wrap);box.append(section);
      const ratio=await new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(Error('Image trop lente à charger : '+src)),20000);img.onload=()=>{clearTimeout(timer);resolve(img.naturalHeight/img.naturalWidth);};img.onerror=()=>{clearTimeout(timer);reject(Error('Image introuvable : '+src));};img.src=asset(src);});
      let minWidth=1;for(const z of v.zones){const vals=['x','y','w','h'].map(k=>Number(z[k]));if(!vals.every(Number.isFinite)||vals[0]<0||vals[1]<0||vals[2]<=0||vals[3]<=0)throw Error('Une ancienne zone a des dimensions invalides; les données originales restent intactes.');minWidth=Math.max(minWidth,vals[0]+vals[2],(vals[1]+vals[3])/ratio);}input.value=String(Math.ceil(Math.max(390,minWidth)));const row={id,label:known?.label||id,src,zones:v.zones,input,ratio};session.rows.push(row);
      const preview=()=>{overlay.replaceChildren();const w=Number(input.value),h=w*ratio;if(!(w>0))return;v.zones.forEach((z,i)=>{const r=el('div','cal-zone');Object.assign(r.style,{left:100*z.x/w+'%',top:100*z.y/h+'%',width:100*z.w/w+'%',height:100*z.h/h+'%'});r.append(el('span','',String(i+1)));overlay.append(r);});};input.oninput=preview;preview();
    }
    if(!session.rows.length&&raw.parts.length===0)throw Error('Aucune annotation ou fiche à récupérer.');legacySession=session;$('legacyApply').disabled=false;
    $('legacyBackup').onclick=()=>download('q310_anciennes_annotations.json',JSON.stringify(raw,null,2),'application/json');$('legacyApply').onclick=applyLegacy;
  }catch(e){$('legacyError').textContent=e.message;toast(e.message,true);}finally{busy=false;}
}
function applyLegacy(){try{requireEditor();if(!legacySession)return;const s=legacySession,next=C.clone(project);next.legacyArchive=s.raw;
  for(const p of s.raw.parts){if(!p||!p.id)continue;const idx=next.parts.findIndex(x=>x.id===p.id);const fixed={...p,medias:C.media(p.medias)};if(idx>=0)next.parts[idx]=fixed;else next.parts.push(fixed);}
  for(const row of s.rows){const width=Number(row.input.value),height=width*row.ratio;const zones=row.zones.map(z=>{const n=C.normalizeLegacyZone(z,width,height);if(!n.partId&&next.parts.some(p=>p.id===z.id))n.partId=z.id;return n;});let target=next.views.find(v=>v.id===row.id);if(!target){target={id:row.id,label:row.label,type:'image',src:row.src,zones:[]};next.views.push(target);}target.zones=zones;target.src=row.src;}
  // Preserve linked views even when they contained no annotations.
  for(const [id,v] of Object.entries(s.raw.views)){if(next.views.some(x=>x.id===id))continue;const known=seed.views.find(x=>x.id===id);if(v.src||known)next.views.push({id,label:known?.label||id,type:v.type||known?.type||'image',src:C.source(v.src||known.src),zones:[]});}
  replaceProject(next);closeDialog('legacyDialog');toast('Annotations récupérées. Vérifie leur position sur chaque vue, puis sauvegarde le projet.');
}catch(e){$('legacyError').textContent=e.message;}}
build();setMode(false);renderStage();renderSide();if(initialWarning)toast(initialWarning,true);
})();
</script>
